  <text x="451" y="69" fill="#979ca6" font-family="Arial,sans-serif" font-size="24">+</text>
  <text x="117" y="128" fill="#7e838d" font-family="Arial,sans-serif" font-size="20">←</text><text x="154" y="128" fill="#7e838d" font-family="Arial,sans-serif" font-size="20">→</text><text x="191" y="128" fill="#7e838d" font-family="Arial,sans-serif" font-size="20">↻</text>
  <rect x="230" y="102" width="1138" height="38" rx="13" fill="#08090b" stroke="#30333b"/>
