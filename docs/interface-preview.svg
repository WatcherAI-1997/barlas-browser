    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff3139"/><stop offset="1" stop-color="#ba0008"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1440" height="820" fill="#050608"/>
  <rect x="36" y="34" width="1368" height="752" rx="22" fill="url(#panel)" stroke="#292c33" filter="url(#shadow)"/>
  <path d="M36 90h1368M96 34v752M36 150h1368" stroke="#292c33"/>
  <g fill="url(#red)"><circle cx="61" cy="55" r="7"/><circle cx="77" cy="55" r="7"/><circle cx="69" cy="69" r="7"/></g>
  <text x="101" y="65" fill="#f5f5f6" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">BARLAS</text>
