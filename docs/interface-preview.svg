  <rect x="1038" y="102" width="112" height="38" rx="12" fill="#261315" stroke="#672126"/><text x="1061" y="126" fill="#f2dfe0" font-family="Arial,sans-serif" font-size="13" font-weight="700">✦ Barlas</text>
  <rect x="49" y="103" width="34" height="34" rx="10" fill="#1c1e23"/><text x="60" y="127" fill="#fff" font-family="Arial,sans-serif" font-size="18">⌂</text>
  <rect x="49" y="151" width="34" height="34" rx="10" fill="url(#red)"/><text x="61" y="174" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">B</text>
  <g transform="translate(348 274)">
    <g fill="url(#red)"><circle cx="72" cy="34" r="31"/><circle cx="140" cy="34" r="31"/><circle cx="106" cy="94" r="31"/></g>
    <text x="180" y="68" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-2">BARLAS Browser</text>
    <text x="185" y="102" fill="#80858e" font-family="Arial,sans-serif" font-size="17" letter-spacing="5">THINK AHEAD. ACT BEYOND.</text>
    <rect x="45" y="160" width="600" height="56" rx="18" fill="#111318" stroke="#2d3037"/>
    <circle cx="73" cy="188" r="5" fill="#4ca768"/><text x="93" y="194" fill="#777c85" font-family="Arial,sans-serif" font-size="15">Поиск Google или адрес сайта</text>
  </g>
  <rect x="1168" y="150" width="236" height="636" fill="#0c0d10" stroke="#292c33"/>
