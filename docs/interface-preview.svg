  <text x="1191" y="386" fill="#8e939c" font-family="Arial,sans-serif" font-size="12">Исследуй, сравнивай и</text><text x="1191" y="405" fill="#8e939c" font-family="Arial,sans-serif" font-size="12">выполняй задачи с BARLAS OS.</text>
  <rect x="1191" y="439" width="190" height="42" rx="12" fill="url(#red)"/><text x="1223" y="465" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Открыть BARLAS OS</text>
