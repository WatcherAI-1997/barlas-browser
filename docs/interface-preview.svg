<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">BARLAS Browser interface preview</title>
  <desc id="desc">Dark browser interface with red accents, tabs, Google address search, and a compact sidebar.</desc>
