<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'" />
    <title>BARLAS Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand" aria-label="BARLAS Browser"><span class="brand-mark"><i></i><i></i><i></i></span><span>BARLAS</span></div>
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="new-tab" class="icon-button new-tab" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка">+</button>
      <div class="window-drag"></div>
    </header>

    <aside class="rail" aria-label="Боковая панель">
      <button id="home" class="rail-button active" title="Новая вкладка" aria-label="Новая вкладка">⌂</button>
      <button id="barlas-os" class="rail-button barlas-button" title="Открыть BARLAS OS" aria-label="Открыть BARLAS OS">B</button>
      <div class="rail-spacer"></div>
      <button id="assistant-toggle" class="rail-button" title="Панель Barlas" aria-label="Панель Barlas">✦</button>
      <button id="settings" class="rail-button" title="Настройки (в разработке)" aria-label="Настройки">⚙</button>
    </aside>

    <nav class="toolbar" aria-label="Навигация">
      <button id="back" class="toolbar-button" title="Назад" aria-label="Назад">←</button>
      <button id="forward" class="toolbar-button" title="Вперёд" aria-label="Вперёд">→</button>
      <button id="reload" class="toolbar-button" title="Обновить" aria-label="Обновить">↻</button>
      <form id="address-form" class="address-form">
        <span id="security-indicator" class="security-indicator" title="Состояние соединения">●</span>
        <input id="address" type="text" autocomplete="off" spellcheck="false" aria-label="Адрес или поисковый запрос" placeholder="Введите адрес или поисковый запрос" />
        <button id="go" type="submit" class="go-button" aria-label="Перейти">↵</button>
      </form>
      <button id="ai-button" class="ai-button" title="BARLAS Assistant"><span>✦</span> Barlas</button>
      <button id="menu" class="toolbar-button" title="Меню" aria-label="Меню">⋮</button>
    </nav>

    <section id="assistant" class="assistant" aria-label="BARLAS Assistant" hidden>
      <div class="assistant-head"><div><span class="assistant-star">✦</span><strong> Barlas</strong></div><button id="assistant-close" aria-label="Закрыть">×</button></div>
      <div class="assistant-body">
        <span class="status-dot"></span><span class="eyebrow">BARLAS OS</span>
        <h2>Работай с интернетом, а не с вкладками.</h2>
        <p>Локальная система подключается к браузеру и помогает исследовать страницы, сравнивать информацию и выполнять задачи.</p>
        <button id="assistant-open-os" class="primary">Открыть BARLAS OS</button>
        <p class="local-note">Локальное подключение: <code>127.0.0.1:17840</code></p>
      </div>
      <div class="assistant-compose"><textarea disabled placeholder="Чат появится после подключения API BARLAS OS"></textarea><button disabled>↑</button></div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
