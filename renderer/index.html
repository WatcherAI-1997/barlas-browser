<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'" />
    <title>BARLAS Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand" aria-label="BARLAS BIT TECHNOLOGY">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span class="brand-copy"><strong>BARLAS BIT</strong><small>TECHNOLOGY</small></span>
      </div>
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="new-tab" class="icon-button new-tab" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка">+</button>
      <div class="window-drag"></div>
    </header>

    <aside class="rail" aria-label="Боковая панель">
      <button id="home" class="rail-button active" title="Новая вкладка" aria-label="Новая вкладка"><span class="rail-icon">⌂</span><span class="rail-label">Старт</span></button>
      <button id="bookmarks" class="rail-button" title="Закладки" aria-label="Закладки"><span class="rail-icon">★</span><span class="rail-label">Закладки</span></button>
      <button id="history" class="rail-button history-button" title="История" aria-label="История"><span class="rail-icon">◷</span><span class="rail-label">История</span></button>
      <button id="downloads" class="rail-button" title="Загрузки" aria-label="Загрузки"><span class="rail-icon">↓</span><span class="rail-label">Загрузки</span><span id="download-dot" class="rail-dot" hidden></span></button>
      <div class="rail-spacer"></div>
      <button id="settings" class="rail-button" title="Настройки" aria-label="Настройки"><span class="rail-icon">⚙</span><span class="rail-label">Настройки</span></button>
    </aside>

    <nav class="toolbar" aria-label="Навигация">
      <button id="back" class="toolbar-button" title="Назад" aria-label="Назад">←</button>
      <button id="forward" class="toolbar-button" title="Вперёд" aria-label="Вперёд">→</button>
      <button id="reload" class="toolbar-button" title="Обновить" aria-label="Обновить">↻</button>
      <form id="address-form" class="address-form">
        <span id="security-indicator" class="security-indicator" title="Состояние соединения">●</span>
        <input id="address" type="text" autocomplete="off" spellcheck="false" aria-label="Адрес или поисковый запрос" placeholder="Введите адрес или поисковый запрос" />
        <button id="bookmark-page" type="button" class="bookmark-button" title="Добавить в закладки" aria-label="Добавить в закладки">☆</button>
        <button id="go" type="submit" class="go-button" aria-label="Перейти">↵</button>
      </form>
      <button id="update-button" class="update-button" type="button" hidden><span class="update-dot"></span><span id="update-button-label">Обновить</span></button>
      <button id="menu" class="toolbar-button" title="Меню" aria-label="Меню">⋮</button>
    </nav>

    <section id="bookmarks-panel" class="side-panel" aria-label="Закладки" hidden>
      <div class="panel-heading">
        <h2 id="bookmarks-title">Закладки</h2>
        <button id="close-bookmarks" class="panel-close" aria-label="Закрыть">×</button>
      </div>
      <div id="bookmarks-empty" class="panel-empty">Сохранённых страниц пока нет</div>
      <div id="bookmarks-list" class="bookmark-list"></div>
    </section>

    <section id="downloads-panel" class="side-panel downloads-panel" aria-label="Загрузки" hidden>
      <div class="panel-heading">
        <h2 id="downloads-title">Загрузки</h2>
        <button id="close-downloads" class="panel-close" aria-label="Закрыть">×</button>
      </div>
      <button id="open-downloads-folder" class="clear-history" type="button">Открыть папку загрузок</button>
      <div id="downloads-empty" class="panel-empty">Загрузок в этом сеансе пока нет</div>
      <div id="downloads-list" class="download-list"></div>
    </section>

    <section id="history-panel" class="side-panel history-panel" aria-label="История" hidden>
      <div class="panel-heading">
        <h2 id="history-title">История</h2>
        <button id="close-history" class="panel-close" aria-label="Закрыть">×</button>
      </div>
      <input id="history-search" class="panel-search" type="search" autocomplete="off" placeholder="Поиск в истории" aria-label="Поиск в истории" />
      <button id="clear-history" class="clear-history" type="button">Очистить историю</button>
      <div id="history-empty" class="panel-empty">История пока пуста</div>
      <div id="history-list" class="history-list"></div>
    </section>

    <section id="settings-panel" class="side-panel settings-panel" aria-label="Настройки" hidden>
      <div class="panel-heading">
        <h2 id="settings-title">Настройки</h2>
        <button id="close-settings" class="panel-close" aria-label="Закрыть">×</button>
      </div>
      <div class="setting-group">
        <label id="search-engine-label" for="search-engine">Поисковая система</label>
        <select id="search-engine">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
      </div>
      <div class="setting-group">
        <label id="language-label" for="interface-language">Язык интерфейса</label>
        <select id="interface-language"></select>
        <p id="language-note" class="setting-note">Автоматический режим использует страну и язык системы.</p>
      </div>
      <div class="setting-group">
        <div id="startup-label" class="setting-label">Запуск</div>
        <label class="setting-switch">
          <input id="restore-session" type="checkbox" />
          <span id="restore-session-label">Восстанавливать открытые вкладки</span>
        </label>
      </div>
      <button id="open-downloads" class="setting-action">Открыть папку загрузок</button>
      <div class="update-card">
        <div><strong id="update-title">Обновления</strong><span id="update-status">Проверка версии…</span></div>
        <button id="check-updates" class="setting-action" type="button">Проверить обновления</button>
        <button id="download-update" class="primary-action" type="button" hidden>Скачать обновление</button>
      </div>
      <div class="settings-version"><strong>BARLAS BIT TECHNOLOGY</strong><span>BARLAS Browser</span></div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
