<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">BARLAS BIT TECHNOLOGY</title>
  <desc id="desc">Black and red BARLAS BIT TECHNOLOGY logo</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181b20"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4148"/>
      <stop offset="1" stop-color="#c90008"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="260" rx="54" fill="url(#background)"/>
  <rect x="2" y="2" width="916" height="256" rx="52" fill="none" stroke="#343840" stroke-width="4"/>
  <g fill="url(#accent)" filter="url(#glow)">
    <circle cx="112" cy="93" r="42"/>
    <circle cx="204" cy="93" r="42"/>
    <circle cx="158" cy="173" r="42"/>
  </g>
  <text x="275" y="124" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="7">BARLAS BIT</text>
  <text x="280" y="176" fill="#ed1c24" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="14">TECHNOLOGY</text>
</svg>
